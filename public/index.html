<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <h1>Calculadora de IMC</h1>
      <p class="sub">O cálculo é feito pela API no backend (<code>POST /api/imc</code>).</p>

      <form id="form-imc" novalidate>
        <label for="peso">Peso (kg)</label>
        <input id="peso" name="peso" type="text" inputmode="decimal" placeholder="ex.: 70" required />

        <label for="altura">Altura (m)</label>
        <input id="altura" name="altura" type="text" inputmode="decimal" placeholder="ex.: 1,75" required />

        <button type="submit">Calcular</button>
      </form>

      <section id="resultado" class="resultado" hidden aria-live="polite"></section>

      <table class="tabela">
        <caption>Tabela de referência</caption>
        <thead>
          <tr><th>IMC (kg/m²)</th><th>Classificação</th></tr>
        </thead>
        <tbody>
          <tr><td>menor que 18,5</td><td>Magreza</td></tr>
          <tr><td>18,5 a 24,9</td><td>Normal</td></tr>
          <tr><td>24,9 a 30</td><td>Sobrepeso</td></tr>
          <tr><td>maior que 30</td><td>Obesidade</td></tr>
        </tbody>
      </table>
    </main>

    <script src="app.js"></script>
  </body>
</html>
